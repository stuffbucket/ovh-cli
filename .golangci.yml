version: "2"

# golangci-lint config for the ovh-cli project.
#
# Phase 1 enables the standard linter set. The full `depguard` ruleset
# documented in PRD-08 §Canonical depguard ruleset (Layer A allowlist,
# no-back-edge auth->client, sensitive-deps confined to internal/auth,
# go-ovh confined to {auth,client,schema}, xdg confined to xdgpaths,
# ini confined to config) lands in the phase-2a/2b PRs that introduce
# those packages. Until then there are no targets for the rules to fire on.
#
# `forbidigo` is enabled so the symbol-level rule (internal/client must
# never call auth lifecycle/oauth functions) is ready to fire as soon as
# the auth and client packages exist.

linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - errcheck
    - forbidigo
    - gocritic
    - gosec
    - govet
    - noctx
    - revive
    - staticcheck

  settings:
    depguard:
      rules:
        # Layer A allowlist: internal/schema may import only the packages
        # listed below. PRD-05 §Module layout. Strict mode rejects anything
        # not on the allow list. Tests in internal/schema use stdlib only
        # ($gostd) so they pass without further additions.
        layer-a-allowlist:
          files:
            - '**/internal/schema/**/*.go'
          list-mode: strict
          allow:
            - $gostd
            - golang.org/x/sync/errgroup
            - github.com/google/renameio/v2
            - github.com/stuffbucket/ovh-cli/internal/xdgpaths

    forbidigo:
      forbid:
        - pattern: 'auth\.(LoadCredentials|StoreCredentials|DeleteCredentials|RefreshOAuth2|NewPKCE|RandomState|LoopbackListen|ExchangePKCE|ValidateHost)'
          msg: 'internal/client must use only the auth.Credentials value type, not auth lifecycle/oauth functions (PRD-06 §Composition root)'
      analyze-types: true

    errcheck:
      # fmt.Fprint* writes to stdout/stderr in cobra commands; the only
      # errors come from broken pipes, which we surface via os.Exit anyway.
      # Enumerating the check at every call site is ceremony without value.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

    revive:
      rules:
        - name: unused-parameter
          disabled: true

  exclusions:
    rules:
      # Test files that exercise the refuse-if-looser file-mode rule (PRD-10
      # §Property / contract tests) need to chmod fixtures to deliberately
      # wrong permissions; gosec G302 fires on every such call.
      - path: '_test\.go'
        linters:
          - gosec
      # The forbidigo rule below is targeted at internal/client/** to enforce
      # the symbol-level confinement of internal/auth. Inside internal/auth
      # itself, callers reference ValidateHost / LoadCredentials / etc. as
      # bare identifiers; analyze-types:true resolves these to auth.X and
      # the rule fires. Skip forbidigo on internal/auth.
      - path: 'internal/auth/'
        linters:
          - forbidigo

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
